name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android SDK & NDK Licenses
        run: |
          export PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;29.0.13113456"
          yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Rename APK Artifact
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release_artifacts/clipper-mobile-${{ github.ref_name }}.apk || cp build/app/outputs/flutter-apk/app-release.apk release_artifacts/clipper-mobile-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release_artifacts/clipper-mobile-${{ github.ref_name }}.aab || cp build/app/outputs/bundle/release/app-release.aab release_artifacts/clipper-mobile-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/*.apk
            release_artifacts/*.aab
